[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cell-biophysics-benchmark"
version = "0.1.1"
description = "Measurement-aware simulation and identifiability benchmark for cell-biophysics trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Aurelio Gómez García" }]
keywords = [
  "single-particle tracking",
  "cell biophysics",
  "anomalous diffusion",
  "AI for science",
  "measurement uncertainty",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
ml = [
  "joblib>=1.3,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
]
space = [
  "gradio>=5.0,<7",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "scikit-learn>=1.4,<2",
]
hub = [
  "huggingface-hub>=0.34,<2",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
cell-biophysics-generate = "cell_biophysics_benchmark.cli:generate_main"

[tool.hatch.build.targets.wheel]
packages = ["src/cell_biophysics_benchmark"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
